name: CI
on:
  workflow_dispatch:
    inputs:
      push-docker-image-to-harbor:
        description: "Push Docker Image to Harbor"
        type: boolean
        default: false
  pull_request:
  push:
    branches:
      - main
      - develop

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
    name: Build & Tests

    steps:
      - name: Checkout DataGateway API
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Create coverage file
        run: touch coverage.xml

      - name: Run unit tests
        run: docker compose run unit-tests

      - name: Start test dependencies
        run: docker compose --profile dependencies up -d

      - name: Wait for test data generation
        run: docker wait dg_api_testdata

      - name: Run integration tests
        run: docker compose run integration-tests

      - name: Upload code coverage
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Show logs on failure
        if: failure()
        run: docker compose logs

      - name: Cleanup
        if: always()
        run: docker compose --profile dependencies down

  linting:
    runs-on: ubuntu-24.04
    name: Linting

    steps:
      - name: Checkout DataGateway API
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run linting
        run: docker compose run lint

  formatting:
    runs-on: ubuntu-24.04
    name: Code Formatting

    steps:
      - name: Checkout DataGateway API
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run formatting checks
        run: docker compose run format

  generator-script-testing:
    runs-on: ubuntu-24.04
    continue-on-error: true
    name: icatdb Generator Script Consistency Test

    steps:
      - name: Checkout PR branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: pr

      - name: Start dependencies
        working-directory: pr
        run: docker compose --profile dependencies up -d

      - name: Wait for test data generation
        run: docker wait dg_api_testdata

      - name: Drop modTime and createTime
        run: |
          docker exec -i icat_mariadb_container \
            mysql -picatdbuserpw -uicatdbuser icatdb \
            < pr/util/columns_to_drop.sql

      - name: Get SQL dump of dummy data
        run: |
          docker exec icat_mariadb_container \
            mysqldump \
            -picatdbuserpw \
            -uicatdbuser \
            --skip-comments \
            icatdb > generator_script_dump_1.sql

      - name: Recreate ICAT environment
        working-directory: pr
        run: |
          docker compose --profile dependencies down
          docker compose --profile dependencies up -d

      - name: Wait for regenerated test data
        run: docker wait dg_api_testdata

      - name: Drop modTime and createTime
        run: |
          docker exec -i icat_mariadb_container \
            mysql -picatdbuserpw -uicatdbuser icatdb \
            < pr/util/columns_to_drop.sql

      - name: Get SQL dump of regenerated data
        run: |
          docker exec icat_mariadb_container \
            mysqldump \
            -picatdbuserpw \
            -uicatdbuser \
            --skip-comments \
            icatdb > generator_script_dump_2.sql

      - name: Diff SQL dumps
        run: diff -s generator_script_dump_1.sql generator_script_dump_2.sql

      - name: Shutdown PR stack
        working-directory: pr
        run: docker compose --profile dependencies down

      - name: Checkout default branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          path: main

      - name: Start default branch dependencies
        working-directory: main
        run: docker compose --profile dependencies up -d

      - name: Wait for test data generation
        run: docker wait dg_api_testdata

      - name: Drop modTime and createTime
        run: |
          docker exec -i icat_mariadb_container \
            mysql -picatdbuserpw -uicatdbuser icatdb \
            < main/util/columns_to_drop.sql

      - name: Get SQL dump of dummy data from default branch generator
        run: |
          docker exec icat_mariadb_container \
            mysqldump \
            -picatdbuserpw \
            -uicatdbuser \
            --skip-comments \
            icatdb > generator_script_dump_main.sql

      # NOTE: If a deliberate change is made to the script that changes
      # generated data, this comparison may fail. The job remains
      # continue-on-error to avoid blocking merges.
      - name: Compare current branch output with default branch
        run: diff -s generator_script_dump_main.sql generator_script_dump_1.sql

      - name: Cleanup
        if: always()
        working-directory: main
        run: docker compose --profile dependencies down

  pip-install-testing:
    runs-on: ubuntu-24.04
    name: Pip Install Test
    env:
      ICAT__URL: https://localhost:18181

    steps:
      - name: Checkout DataGateway API
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          architecture: x64

      - name: Start test dependencies
        run: docker compose --profile dependencies up -d

      - name: Create and activate virtual environment
        run: |
          python3 -m venv dg-api-venv
          source dg-api-venv/bin/activate
      - name: Install DataGateway API via pip
        run: pip install .

        # Prep for using the API for tests
      - name: Create .env
        run: cp .env.example .env
      - name: Create search_api_mapping.json
        run: cp datagateway_api/search_api_mapping.json.example datagateway_api/search_api_mapping.json
      - name: Create logging.ini
        run: cp logging.example.ini logging.ini

      # Launch API to see if it starts correctly or has a startup issue
      # Code logic used from https://stackoverflow.com/a/63643845
      - name: Start API
        run: timeout 10 python -m datagateway_api.main || code=$?; if [[ $code -ne 124 && $code -ne 0 ]]; then exit $code; fi

  image-scan:
    runs-on: ubuntu-24.04
    name: Docker Image Vulnerability Scan
    permissions:
      contents: read
      # Required to upload the Trivy SARIF report to GitHub code scanning
      security-events: write

    steps:
      - name: Checkout DataGateway API
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build production image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          target: prod
          push: false
          load: true
          tags: datagateway-api:scan

      # Reports every severity to GitHub code scanning so that issues are visible in the
      # Security tab without failing the build.
      - name: Scan image with Trivy (report)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: datagateway-api:scan
          scanners: vuln
          format: sarif
          output: trivy-results.sarif

      # Code scanning uploads are not permitted for pull requests raised from forks
      - name: Upload Trivy report to GitHub code scanning
        if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
        uses: github/codeql-action/upload-sarif@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4.38.0
        with:
          sarif_file: trivy-results.sarif
          category: trivy-image

      # Fails the build only for HIGH/CRITICAL vulnerabilities that have a fix available,
      # i.e. ones that can actually be resolved by rebuilding against newer packages.
      - name: Scan image with Trivy (fail on fixable HIGH/CRITICAL)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: datagateway-api:scan
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          trivyignores: .trivyignore
          format: table
          exit-code: "1"

  docker:
    # This job triggers only if all the other jobs succeed and does different things depending on the context.
    # The job builds the Docker image in all cases and also pushes the image to Harbor only if something is
    # pushed to the main branch.
    needs:
      [
        tests,
        linting,
        formatting,
        generator-script-testing,
        pip-install-testing,
        image-scan,
      ]
    name: Docker
    runs-on: ubuntu-24.04
    env:
      PUSH_DOCKER_IMAGE_TO_HARBOR: ${{ inputs.push-docker-image-to-harbor != null && inputs.push-docker-image-to-harbor || 'false' }}
    steps:
      - name: Check out repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v3.5.3

      - name: Login to Harbor
        if: ${{ fromJSON(env.PUSH_DOCKER_IMAGE_TO_HARBOR) }}
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ vars.HARBOR_URL }}
          username: ${{ secrets.HARBOR_USERNAME }}
          password: ${{ secrets.HARBOR_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ vars.HARBOR_URL }}/datagateway-api

      - name: ${{ fromJSON(env.PUSH_DOCKER_IMAGE_TO_HARBOR) && 'Build and push Docker image to Harbor' || 'Build Docker image' }}
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          push: ${{ fromJSON(env.PUSH_DOCKER_IMAGE_TO_HARBOR) }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
